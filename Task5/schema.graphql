type Query {
  client(id: String!): Client
  documents(clientId: String!): [Document]
  relatives(clientId: String!): [Relative]
}

type Client {
  id: String!
  name: String!
  age: Int!
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: String!
  type: String!
  number: String!
  issueDate: String!
  expiryDate: String!
}

type Relative {
  id: String!
  relationType: String!
  name: String!
  age: Int!
}

# Получение клиента с основными данными
query GetClient($clientId: String!) {
  client(id: $clientId) {
    id
    name
    age
  }
}

# Получение клиента с документами
query GetClientWithDocuments($clientId: String!) {
  client(id: $clientId) {
    id
    documents {
      type
      number
      issueDate
      expiryDate
    }
  }
}

# Получение родственников клиента
query GetClientWithRelatives($clientId: String!) {
  client(id: $clientId) {
    id
    relatives {
      name
      relationType
      age
    }
  }
}